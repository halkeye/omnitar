spec:
  name: internal-profile-http
  region: tor1
  databases:
  - engine: PG
    name: db
    version: "17"
  ingress:
    rules:
    - component:
        name: internal-profile-http
      match:
        path:
          prefix: /
  services:
    - name: internal-profile-http
      git:
        branch: main
        repo_clone_url: https://github.com/halkeye/internal-profile-http
      dockerfile_path: /Dockerfile
      source_dir: /
      envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: SESSION_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SLACK_CLIENT_ID
        scope: RUN_TIME
      - key: SLACK_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: ATLASSIAN_CLIENT_ID
        scope: RUN_TIME
      - key: ATLASSIAN_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      http_port: 8080
      health_check:
        http_path: /
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-0.5gb
      routes:
        - path: /
